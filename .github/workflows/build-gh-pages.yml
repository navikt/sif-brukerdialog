name: Build and deploy gh-pages

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-and-deploy-gh-pages-content:
    name: Build and Deploy storybook and demo apps to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Sjekk ut koden
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sett opp pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      # Sett opp Node.js
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      # Installer avhengigheter
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.READER_TOKEN }}

      # Bygg Storybook (eget prosjekt)
      - name: Build Storybook
        run: pnpm build-storybook
        working-directory: apps/storybook

      # Flytt Storybook-output til en subfolder
      - name: Prepare Storybook for deployment
        run: |
          mkdir -p deployment/storybook
          mv apps/storybook/storybook-static/* deployment/storybook/

      # Bygg ungdomsytelse-deltaker demo-app med gh-pages:rebuild
      - name: Build ungdomsytelse-deltaker
        run: pnpm gh-pages:rebuild
        working-directory: apps/ungdomsytelse-deltaker

      # Flytt ungdomsytelse-deltaker-output til en subfolder
      - name: Kopier ungdomsytelse-deltaker til gh-pages
        run: |
          mkdir -p deployment/ungdomsytelse-deltaker
          mv apps/ungdomsytelse-deltaker/dist-demo/* deployment/ungdomsytelse-deltaker/

      # Bygg ungdomsytelse-veileder demo-app med gh-pages:rebuild
      # - name: Build ungdomsytelse-veileder
      #   run: pnpm gh-pages:rebuild
      #   working-directory: apps-intern/ungdomsytelse-veileder

      # Flytt ungdomsytelse-veileder-output til en subfolder
      # - name: Kopier ungdomsytelse-veileder demo til gh-pages
      #   run: |
      #     mkdir -p deployment/ungdomsytelse-veileder
      #     mv apps-intern/ungdomsytelse-veileder/dist-demo/* deployment/ungdomsytelse-veileder/

      # Bygg opplaringspenger-soknad demo-app med gh-pages:rebuild
      - name: Build opplaringspenger-soknad
        run: pnpm gh-pages:rebuild
        working-directory: apps/opplaringspenger-soknad

      # Flytt opplaringspenger-soknad-output til en subfolder
      - name: Kopier opplaringspenger-soknad til gh-pages
        run: |
          mkdir -p deployment/opplaringspenger-soknad
          mv apps/opplaringspenger-soknad/dist-demo/* deployment/opplaringspenger-soknad/

      # Bygg endringsmelding-pleiepenger demo-app med gh-pages:rebuild
      - name: Build endringsmelding-pleiepenger
        run: pnpm gh-pages:rebuild
        working-directory: apps/endringsmelding-pleiepenger

      # Flytt endringsmelding-pleiepenger-output til en subfolder
      - name: Kopier endringsmelding-pleiepenger til gh-pages
        run: |
          mkdir -p deployment/endringsmelding-pleiepenger
          mv apps/endringsmelding-pleiepenger/dist-demo/* deployment/endringsmelding-pleiepenger/

      # Bygg aktivitetspenger-innsyn demo-app med gh-pages:rebuild
      - name: Build aktivitetspenger-innsyn
        run: pnpm gh-pages:rebuild
        working-directory: apps/aktivitetspenger-innsyn

      # Flytt aktivitetspenger-innsyn-output til en subfolder
      - name: Kopier aktivitetspenger-innsyn til gh-pages
        run: |
          mkdir -p deployment/aktivitetspenger-innsyn
          mv apps/aktivitetspenger-innsyn/dist-demo/* deployment/aktivitetspenger-innsyn/

      # Bygg aktivitetspenger-soknad-storybook
      - name: Build aktivitetspenger-soknad-storybook
        run: pnpm build-storybook
        working-directory: apps/aktivitetspenger-soknad

      # Flytt aktivitetspenger-soknad-storybook til gh-pages
      - name: Kopier aktivitetspenger-soknad-storybook til gh-pages
        run: |
          mkdir -p deployment/aktivitetspenger-soknad-storybook
          mv apps/aktivitetspenger-soknad/storybook-static/* deployment/aktivitetspenger-soknad-storybook/

      # Bygg ungdomsytelse-deltaker-storybook
      - name: Build ungdomsytelse-deltaker-storybook
        run: pnpm build-storybook
        working-directory: apps/ungdomsytelse-deltaker

      # Flytt ungdomsytelse-deltaker-storybook til gh-pages
      - name: Kopier ungdomsytelse-deltaker-storybook til gh-pages
        run: |
          mkdir -p deployment/ungdomsytelse-deltaker-storybook
          mv apps/ungdomsytelse-deltaker/storybook-static/* deployment/ungdomsytelse-deltaker-storybook/

      # Bygg ung-innsyn-storybook
      - name: Build ung-innsyn-storybook
        run: pnpm build-storybook
        working-directory: packages/ung-innsyn

      # Flytt ung-innsyn-storybook til gh-pages
      - name: Kopier ung-innsyn-storybook til gh-pages
        run: |
          mkdir -p deployment/ung-innsyn-storybook
          mv packages/ung-innsyn/storybook-static/* deployment/ung-innsyn-storybook/

      # Bygg forsiden som lenker til alle demoer og storybooks
      - name: Build gh-pages-forside
        run: pnpm build
        working-directory: gh-pages

      # Legg forsiden på roten av gh-pages
      - name: Kopier forside til gh-pages
        run: |
          mkdir -p deployment
          cp -r gh-pages/dist/* deployment/

      # Last opp bygget som en artefakt
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: deployment

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-deploy-gh-pages-content
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
