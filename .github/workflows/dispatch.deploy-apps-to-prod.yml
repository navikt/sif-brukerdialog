name: Deploy apps to prod

on:
    push:
        branches:
            - main
        paths:
            - "apps/**/*"
            - "server/**/*"
            - "packages/**/*"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:
        inputs:
            app:
                description: "Select app to deploy"
                required: true
                type: choice
                options:
                    - aktivitetspenger-innsyn
                    - aktivitetspenger-soknad
                    - dine-pleiepenger
                    - ekstra-omsorgsdager-andre-forelder-ikke-tilsyn
                    - endringsmelding-pleiepenger
                    - omsorgsdager-aleneomsorg-dialog
                    - omsorgsdager-kalkulator
                    - omsorgspengerutbetaling-arbeidstaker-soknad
                    - omsorgspengerutbetaling-soknad
                    - omsorgspengesoknad
                    - opplaringspenger-soknad
                    - pleiepenger-i-livets-sluttfase-soknad
                    - pleiepenger-sykt-barn
                    - sif-ettersending
                    - ungdomsytelse-deltaker

permissions:
    contents: write
    security-events: write
    id-token: write
    actions: read

jobs:
    detect-changes:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            apps: ${{ steps.merge.outputs.apps }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            # Turbo ser ikke server/** (appene avhenger ikke av @sif/server), så paths-filter beholdes for det
            - uses: dorny/paths-filter@v4.0.3
              id: filter
              with:
                  filters: |
                      #   aktivitetspenger-innsyn:
                      #     - 'apps/aktivitetspenger-innsyn/**'
                      #     - 'packages/core/ung-innsyn/**'
                      #     - 'server/**'
                      #   aktivitetspenger-soknad:
                      #     - 'apps/aktivitetspenger-soknad/**'
                      #     - 'packages/core/sif-soknad-app/**'
                      #     - 'server/**'
                        dine-pleiepenger:
                          - 'apps/dine-pleiepenger/**'
                          - 'server/**'
                        ekstra-omsorgsdager-andre-forelder-ikke-tilsyn:
                          - 'apps/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn/**'
                          - 'server/**'
                        endringsmelding-pleiepenger:
                          - 'apps/endringsmelding-pleiepenger/**'
                          - 'server/**'
                        omsorgsdager-aleneomsorg-dialog:
                          - 'apps/omsorgsdager-aleneomsorg-dialog/**'
                          - 'server/**'
                        omsorgsdager-kalkulator:
                          - 'apps/omsorgsdager-kalkulator/**'
                          - 'server/**'
                        omsorgspengerutbetaling-arbeidstaker-soknad:
                          - 'apps/omsorgspengerutbetaling-arbeidstaker-soknad/**'
                          - 'server/**'
                        omsorgspengerutbetaling-soknad:
                          - 'apps/omsorgspengerutbetaling-soknad/**'
                          - 'server/**'
                        omsorgspengesoknad:
                          - 'apps/omsorgspengesoknad/**'
                          - 'server/**'
                        opplaringspenger-soknad:
                          - 'apps/opplaringspenger-soknad/**'
                          - 'server/**'
                        pleiepenger-i-livets-sluttfase-soknad:
                          - 'apps/pleiepenger-i-livets-sluttfase-soknad/**'
                          - 'server/**'
                        pleiepenger-sykt-barn:
                          - 'apps/pleiepenger-sykt-barn/**'
                          - 'server/**'
                        sif-ettersending:
                          - 'apps/sif-ettersending/**'
                          - 'server/**'
                        ungdomsytelse-deltaker:
                          - 'apps/ungdomsytelse-deltaker/**'
                          - 'server/**'

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js environment
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  NPM_TOKEN: ${{ secrets.READER_TOKEN }}

            # Fanger opp endringer i packages/** og avhengigheter i pnpm-lock.yaml.
            # Endring i rot-package.json (f.eks. pnpm.overrides) gir alle apper.
            - name: Resolve affected apps (turbo)
              id: affected
              shell: bash
              env:
                  TURBO_SCM_BASE: ${{ github.event.before }}
                  TURBO_SCM_HEAD: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  apps="$(pnpm turbo ls --affected --output=json \
                      --filter=@navikt/dine-pleiepenger \
                      --filter=@navikt/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn \
                      --filter=@navikt/endringsmelding-pleiepenger \
                      --filter=@navikt/omsorgsdager-aleneomsorg-dialog \
                      --filter=@navikt/omsorgsdager-kalkulator \
                      --filter=@navikt/omsorgspengerutbetaling-arbeidstaker-soknad \
                      --filter=@navikt/omsorgspengerutbetaling-soknad \
                      --filter=@navikt/omsorgspengesoknad \
                      --filter=@navikt/opplaringspenger-soknad \
                      --filter=@navikt/pleiepenger-i-livets-sluttfase-soknad \
                      --filter=@navikt/pleiepenger-sykt-barn \
                      --filter=@navikt/sif-ettersending \
                      --filter=@navikt/ungdomsytelse-deltaker \
                      | jq -c '[.packages.items[].name | sub("^@navikt/"; "")]')"

                  echo "Affected apps (turbo): $apps"
                  echo "apps=$apps" >> "$GITHUB_OUTPUT"

            - name: Merge changed apps
              id: merge
              shell: bash
              env:
                  FILTER_APPS: ${{ steps.filter.outputs.changes }}
                  AFFECTED_APPS: ${{ steps.affected.outputs.apps }}
              run: |
                  set -euo pipefail

                  apps="$(jq -cn --argjson a "$FILTER_APPS" --argjson b "$AFFECTED_APPS" '$a + $b | unique')"

                  echo "Apps to deploy: $apps"
                  echo "apps=$apps" >> "$GITHUB_OUTPUT"

    deploy-dine-pleiepenger:
        if: |
            always() &&
            (github.event_name == 'workflow_dispatch' && inputs.app == 'dine-pleiepenger' ||
             github.event_name == 'push' && contains(needs.detect-changes.outputs.apps, 'dine-pleiepenger'))
        needs: [detect-changes]
        uses: ./.github/workflows/.test-and-deploy-to-prod.yml
        secrets: inherit
        with:
            app-name: "dine-pleiepenger"
            working-directory: "apps/dine-pleiepenger"
            package-name: "@navikt/dine-pleiepenger"
            is-next-app: true
            needs-env-file: true

    deploy-ekstra-omsorgsdager-andre-forelder-ikke-tilsyn:
        if: |
            always() &&
            (github.event_name == 'workflow_dispatch' && inputs.app == 'ekstra-omsorgsdager-andre-forelder-ikke-tilsyn' ||
             github.event_name == 'push' && contains(needs.detect-changes.outputs.apps, 'ekstra-omsorgsdager-andre-forelder-ikke-tilsyn'))
        needs: [detect-changes]
        uses: ./.github/workflows/.test-and-deploy-to-prod.yml
        secrets: inherit
        with:
            app-name: "ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"
            working-directory: "apps/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"
            use-cdn: true
            package-name: "@navikt/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"

    deploy-endringsmelding-pleiepenger:
        if: |
            always() &&
            (github.event_name == 'workflow_dispatch' && inputs.app == 'endringsmelding-pleiepenger' ||
             github.event_name == 'push' && contains(needs.detect-changes.outputs.apps, 'endringsmelding-pleiepenger'))
        needs: [detect-changes]
        uses: ./.github/workflows/.test-and-deploy-to-prod.yml
        secrets: inherit
        with:
            app-name: "endringsmelding-pleiepenger"
            working-directory: "apps/endringsmelding-pleiepenger"
            use-cdn: true
            package-name: "@navikt/endringsmelding-pleiepenger"
            playwright-with-deps: true

    deploy-omsorgsdager-aleneomsorg-dialog:
