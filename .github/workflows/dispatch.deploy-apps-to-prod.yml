name: Deploy apps to prod

on:
    push:
        branches:
            - main
        paths:
            - "apps/**/*"
            - "server/**/*"
            - "packages/**/*"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:
        inputs:
            app:
                description: "Select app to deploy"
                required: true
                type: choice
                options:
                    - aktivitetspenger-innsyn
                    - aktivitetspenger-soknad
                    - dine-pleiepenger
                    - ekstra-omsorgsdager-andre-forelder-ikke-tilsyn
                    - endringsmelding-pleiepenger
                    - omsorgsdager-aleneomsorg-dialog
                    - omsorgsdager-kalkulator
                    - omsorgspengerutbetaling-arbeidstaker-soknad
                    - omsorgspengerutbetaling-soknad
                    - omsorgspengesoknad
                    - opplaringspenger-soknad
                    - pleiepenger-i-livets-sluttfase-soknad
                    - pleiepenger-sykt-barn
                    - sif-ettersending
                    - ungdomsytelse-deltaker

permissions:
    contents: write
    security-events: write
    id-token: write
    actions: read

jobs:
    detect-changes:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        # Kjører pnpm install (tredjeparts install-skript), så ingen arvede skrive-/id-token-rettigheter
        permissions:
            contents: read
        outputs:
            apps: ${{ steps.affected.outputs.apps }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js environment
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  NPM_TOKEN: ${{ secrets.READER_TOKEN }}

            # Turbo fanger opp endringer i appen, packages/** og avhengigheter i pnpm-lock.yaml.
            # Endring i overrides (via pnpm-lock.yaml) gir alle apper.
            - name: Resolve affected apps
              id: affected
              shell: bash
              env:
                  TURBO_SCM_BASE: ${{ github.event.before }}
                  TURBO_SCM_HEAD: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  # Apper som prodsettes automatisk ved push. aktivitetspenger-* er bevisst utelatt.
                  apps=(
                      dine-pleiepenger
                      ekstra-omsorgsdager-andre-forelder-ikke-tilsyn
                      endringsmelding-pleiepenger
                      omsorgsdager-aleneomsorg-dialog
                      omsorgsdager-kalkulator
                      omsorgspengerutbetaling-arbeidstaker-soknad
                      omsorgspengerutbetaling-soknad
                      omsorgspengesoknad
                      opplaringspenger-soknad
                      pleiepenger-i-livets-sluttfase-soknad
                      pleiepenger-sykt-barn
                      sif-ettersending
                      ungdomsytelse-deltaker
                  )
                  app_dir="apps"
                  server_package="@sif/server"

                  # Appene får serveren via `turbo prune` i Dockerfile, ikke via package.json,
                  # så Turbo kjenner ikke koblingen. Den leses derfor fra Dockerfile.
                  apps_with_server="$(for app in "${apps[@]}"; do
                      if grep -qE "turbo prune .*${server_package}( |$)" "$app_dir/$app/Dockerfile"; then echo "$app"; fi
                  done | jq -Rsc 'split("\n") | map(select(length > 0))')"

                  filters=("--filter=$server_package")
                  for app in "${apps[@]}"; do filters+=("--filter=@navikt/$app"); done

                  affected="$(pnpm turbo ls --affected --output=json "${filters[@]}" | jq -c '[.packages.items[].name]')"

                  echo "Apps with server: $apps_with_server"
                  echo "Affected packages (turbo): $affected"

                  apps_to_deploy="$(jq -c --arg server "$server_package" --argjson withServer "$apps_with_server" '
                      ([.[] | select(startswith("@navikt/")) | sub("^@navikt/"; "")]
                      + (if index($server) then $withServer else [] end))
                      | unique' <<< "$affected")"

                  echo "Apps to deploy: $apps_to_deploy"
                  echo "apps=$apps_to_deploy" >> "$GITHUB_OUTPUT"

    deploy-dine-pleiepenger:
        if: |
            always() &&
            (github.event_name == 'workflow_dispatch' && inputs.app == 'dine-pleiepenger' ||
             github.event_name == 'push' && contains(needs.detect-changes.outputs.apps, 'dine-pleiepenger'))
        needs: [detect-changes]
        uses: ./.github/workflows/.test-and-deploy-to-prod.yml
        secrets: inherit
        with:
            app-name: "dine-pleiepenger"
            working-directory: "apps/dine-pleiepenger"
            package-name: "@navikt/dine-pleiepenger"
            is-next-app: true
            needs-env-file: true

    deploy-ekstra-omsorgsdager-andre-forelder-ikke-tilsyn:
        if: |
            always() &&
            (github.event_name == 'workflow_dispatch' && inputs.app == 'ekstra-omsorgsdager-andre-forelder-ikke-tilsyn' ||
             github.event_name == 'push' && contains(needs.detect-changes.outputs.apps, 'ekstra-omsorgsdager-andre-forelder-ikke-tilsyn'))
        needs: [detect-changes]
        uses: ./.github/workflows/.test-and-deploy-to-prod.yml
        secrets: inherit
        with:
            app-name: "ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"
            working-directory: "apps/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"
            use-cdn: true
            package-name: "@navikt/ekstra-omsorgsdager-andre-forelder-ikke-tilsyn"

    deploy-endringsmelding-pleiepenger:
