name: .Deploy application to prod

on:
    workflow_call:
        inputs:
            working-directory:
                type: string
                required: true
            app-name:
                type: string
                required: true
            is-next-app:
                type: boolean
                required: false
            use-cdn:
                type: boolean
                required: false
                default: false

permissions: {}

jobs:
    deploy-to-prod:
        name: Deploy ${{ inputs.app-name }} to prod
        runs-on: ubuntu-latest
        permissions:
            contents: read # required: actions/checkout
            id-token: write # required: nais/docker-build-push
        outputs:
            image: ${{ steps.docker-push.outputs.image }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
            - name: Setup Node.js environment
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  NPM_TOKEN: ${{ secrets.READER_TOKEN }}

            - name: Copy .env.prod for next.js build
              if: ${{ inputs.is-next-app == true }}
              shell: bash
              run: |
                  echo "Copying .env.prod to app root"
                  cp apps/${{inputs.app-name}}/nais/envs/.env.prod apps/${{inputs.app-name}}/.env.production

            - name: Build application
              run: pnpm turbo run build --filter=@navikt/${{ inputs.app-name }}

            - name: Upload assets to CDN
              if: ${{ inputs.use-cdn == true }}
              uses: nais/deploy/actions/cdn-upload/v2@033f70f2484ddfa91dc3d878e06ced3113f996ad # v3
              with:
                  team: dusseldorf
                  source: apps/${{ inputs.app-name }}/dist
                  destination: /${{ inputs.app-name }}
                  project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
                  identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

            - name: Build and publish docker image
              uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c # v0
              id: docker-push
              with:
                  team: dusseldorf
                  push_image: true
                  pull: true
                  dockerfile: apps/${{inputs.app-name}}/Dockerfile
                  docker_context: .
                  image_suffix: ${{inputs.app-name}}-mono
                  project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
                  identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
                  build_secrets: |
                      NPM_TOKEN=${{ secrets.READER_TOKEN }}

            - name: Deploy to prod
              uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # v3
              env:
                  CLUSTER: prod-gcp
                  RESOURCE: nais-config/nais.yml
                  VARS: apps/${{ inputs.app-name }}/nais/prod-gcp.json
                  VAR: GITHUB_REF_NAME=${{ github.ref_name }} # brukes i applikasjonerna
                  IMAGE: ${{ steps.docker-push.outputs.image }}

    trivy:
        needs: [deploy-to-prod]
        uses: navikt/sif-gha-workflows/.github/workflows/trivy.yml@cb2d8a237714c848b24fc54f1e3368670aa9d072 # main
        permissions:
            contents: write
            security-events: write
            id-token: write
            actions: read
        secrets: inherit
        with:
            image: ${{ needs.deploy-to-prod.outputs.image }}
            team: dusseldorf
