name: SonarCloud app scan

on:
    workflow_call:
        inputs:
            app:
                description: "App-mappen under ./apps"
                required: true
                type: string
            working-directory:
                type: string
                required: true

permissions: {}

jobs:
    scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read # required: actions/checkout
            id-token: none
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
              with:
                  args: >
                      -Dproject.settings=${{ inputs.working-directory }}/sonar-project.properties
                      -Dsonar.projectBaseDir=${{ inputs.working-directory }}
                  #   -Dsonar.verbose=true
                  #   -Dsonar.log.level=DEBUG
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
